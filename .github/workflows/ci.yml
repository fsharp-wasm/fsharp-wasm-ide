name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # the compiler the module is built with (a fsharp-wasm revision; replace by a release binary when there is one)
  COMPILER_REF: e820a4e3af38b74c751fc3e90fb9065b1126e476

jobs:
  # The editor under .NET: it builds, and the scripted session passes through the real hit tester and key path.
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Submodules
        run: |
          git submodule update --init lib/graphics lib/runtime lib/fsharp-wasm-core
          git -C lib/graphics submodule update --init lib/GlyphAura
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: source build/env.sh && dotnet build FSharp.Wasm.Ide.slnx -c Release
      - name: Session test
        run: source build/env.sh && dotnet run --project tests/WidgetEditor.Session -c Release --no-build -- shots
      - name: Screenshots of the session
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-shots
          path: shots/*.png
          if-no-files-found: ignore

  # The module as WebAssembly GC: compiled by fsharp-wasm, driven in Chromium.
  wasm:
    runs-on: ubuntu-24.04   # Playwright does not support chromium on ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v6
      - name: Submodules
        run: git submodule update --init lib/graphics lib/runtime lib/fsharp-wasm-core

      - name: Compiler checkout
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm
          ref: ${{ env.COMPILER_REF }}
          path: compiler
      - name: Compiler submodules
        run: git -C compiler submodule update --init --depth 1 vendor/Fable vendor/fsharp core

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # vendor/fsharp pins the 10.0.3xx SDK band (no roll-forward): 10.0.303 builds the patched F# compiler.  The build is cached
      # per revision of that submodule (the compiler's own CI does the same).
      - name: Patched F# compiler (cache)
        id: fsc
        uses: actions/cache@v5
        with:
          path: compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0
          key: fsc-${{ runner.os }}-${{ hashFiles('compiler/.gitmodules') }}-${{ env.COMPILER_REF }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.303
            10.0.x
      - name: Patched F# compiler (build)
        if: steps.fsc.outputs.cache-hit != 'true'
        working-directory: compiler/vendor/fsharp
        run: |
          mkdir -p artifacts
          ./build/build.sh -c Release
          test -f artifacts/bin/fsc/Release/net10.0/fsc.dll

      # a fixed version (the one the checks were made with); no call to the GitHub API, whose unauthenticated limit failed this step on main
      - name: Install wasm-tools
        env:
          WASM_TOOLS: 1.263.0
        run: |
          curl -sSfL --retry 4 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS}/wasm-tools-${WASM_TOOLS}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          sudo install -m755 "$RUNNER_TEMP/wasm-tools-${WASM_TOOLS}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Build WidgetEditor.wasm
        env:
          FSHARP_WASM_DIR: ${{ github.workspace }}/compiler
          FSHARP_COMPILER: ${{ github.workspace }}/compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: bash build/build.sh

      - name: Install Playwright and Chromium
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Widget editor in Chromium
        run: node tests/e2e/editor.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: WidgetEditor.wasm
          path: dist/WidgetEditor.wasm
